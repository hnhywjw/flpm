services:
  projectflow:
    build:
      context: .
      args:
        NODE_IMAGE: docker.m.daocloud.io/library/node:22-bookworm-slim
    image: projectflow:latest
    container_name: projectflow
    restart: unless-stopped
    # 不直接对外暴露 3000，仅通过 nginx 反代访问
    expose:
      - "3000"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - DB_PATH=/app/db/app.db
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # 定时任务鉴权：scheduler.js 与 /api/jobs 共用这一个值
      # 未配置时 /api/jobs 会拒绝所有 token 通道（安全默认值），
      # 也就是说定时任务会全部失效 —— 所以必须有值
      - JOB_TOKEN=${JOB_TOKEN:?JOB_TOKEN 未配置，请先创建 .env 文件}
      # 验证码签名密钥（不配则用进程内随机值，重启后旧验证码失效）
      - CAPTCHA_SECRET=${CAPTCHA_SECRET:-}
      # 初始默认密码：部署时必须显式配置，不再在代码里写死
      #
      # 为什么要强制：
      #   写死默认密码 = 所有系统开箱都是同一个密码，等于公开的后门。
      #   这里用 ${VAR:?消息} 语法，未配置时 compose 直接报错退出，
      #   部署阶段就暴露问题，而不是等账号被人登进去。
      #
      # 用途：新建用户 / 管理员重置密码 / 种子脚本的初始密码，
      #       同时也是「是否还在用默认密码」的判定基准。
      - DEFAULT_PWD=${DEFAULT_PWD:?DEFAULT_PWD 未配置，请在 .env 中设置初始默认密码}
    volumes:
      - ./db:/app/db
      - ./uploads:/app/uploads
      # 证书以只读方式挂入，供「参数配置 → 证书状态」检测展示
      # 应用本身不直接使用证书（TLS 由 nginx 终止）
      - ./certs:/app/certs:ro
    networks:
      - projectflow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: projectflow-nginx
    restart: unless-stopped
    ports:
      - "9443:443"
      - "9081:80"
    volumes:
      - ./nginx/projectflow.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      projectflow:
        condition: service_healthy
    networks:
      - projectflow-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  projectflow-net:
    driver: bridge
